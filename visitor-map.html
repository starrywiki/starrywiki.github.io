<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Views</title>
  <style>
    html, body { margin: 0; padding: 0; background: #fff; color: #6d737c; font: 14px/1.5 Arial, sans-serif; }
    #views-count { margin: 0 0 7px; }
    #visitor-map-image { display: block; width: 100%; height: auto; }
    #visitor-map-image[hidden] { display: none; }
    #visitor-source { position: absolute; left: -10000px; top: 0; width: 220px; visibility: hidden; pointer-events: none; }
  </style>
  <script src="scripts/visitor-map.js" defer></script>
</head>
<body>
  <p id="views-count">Views</p>
  <img id="visitor-map-image" width="220" height="108" alt="Static world map of visitor regions" draggable="false" hidden>
  <!-- The provider records one visit. Only its final static map and actual total are displayed. -->
  <div id="visitor-source" aria-hidden="true" inert>
    <script type="text/javascript" id="mapmyvisitors" src="https://mapmyvisitors.com/map.js?d=krCJyW10zZBSX62WNkBTEaiTQ-XwxBV21vLOmRqwMG4&amp;cl=d8dfe6&amp;w=220&amp;t=tt&amp;co=ffffff&amp;cmo=e34b4b&amp;cmn=e34b4b&amp;ct=6d737c"></script>
  </div>
</body>
</html>
